# ============================================================
# BookVoice-AI — Server Compose
# Nur BookVoice-AI Container!
# KI-ARCHIV PRO laeuft in compose.yaml (separat)
# ============================================================

services:

  # ============================================================
  # Backend: FastAPI + FastWhisper + XTTS-v2
  # ============================================================
  ki-archiv-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: ki-archiv-tts
    ports:
      - "7500:7500"
    volumes:
      - /mnt/data/docker-data/ki-archiv/tts_models:/root/.local/share/tts
      - /mnt/data/docker-data/ki-archiv/tts_models:/app/tts_models
      - /mnt/data/docker-data/ki-archiv/tts_server.py:/app/tts_server.py
      - /mnt/data/docker-data/ki-archiv/HOERBUCH:/app/HOERBUCH
      - /mnt/data/docker-data/ki-archiv/TRANSKRIPTIONEN:/app/TRANSKRIPTIONEN
      - /mnt/data/docker-data/ki-archiv/ARCHIV:/app/ARCHIV
    environment:
      - TTS_OUTPUT=/app/HOERBUCH
      - TTS_LANG=tr
    restart: unless-stopped

  # ============================================================
  # Frontend: HTML via nginx
  # ============================================================
  ki-archiv-web:
    image: nginx:alpine
    container_name: ki-archiv-web
    ports:
      - "7501:80"
    volumes:
      - /mnt/data/docker-data/ki-archiv/ki_archiv_tts_web.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  # ============================================================
  # Proxy: Nginx Reverse Proxy (Port 7502 -> Domain)
  # ============================================================
  ki-archiv-proxy:
    image: nginx:alpine
    container_name: ki-archiv-proxy
    ports:
      - "7502:80"
    volumes:
      - /mnt/data/docker-data/ki-archiv/nginx-bookvoice.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/data/docker-data/ki-archiv/ki_archiv_tts_web.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - ki-archiv-tts
      - ki-archiv-web
    restart: unless-stopped
