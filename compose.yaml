services:
  bookvoice-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    container_name: bookvoice-tts
    ports:
      - "7500:7500"
    volumes:
      - bookvoice-tts-models:/root/.local/share/tts
      - bookvoice-tts-models:/app/tts_models
      - bookvoice-hoerbuch:/app/HOERBUCH
      - bookvoice-musik:/app/musik
      - ./tts_server.py:/app/tts_server.py
    environment:
      - TTS_OUTPUT=/app/HOERBUCH
      - TTS_LANG=tr
      - COQUI_TOS_AGREED=1
    restart: unless-stopped

  bookvoice-proxy:
    image: nginx:alpine
    container_name: bookvoice-proxy
    ports:
      - "7502:80"
    volumes:
      - ./nginx-bookvoice.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ki_archiv_tts_web.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - bookvoice-tts
    restart: unless-stopped

volumes:
  bookvoice-tts-models:
  bookvoice-hoerbuch:
  bookvoice-musik:
